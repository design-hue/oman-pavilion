<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oman Pavilion · COP31</title>
<style>
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:400;font-display:swap;src:url(get-to-know-oman/assets/fonts/IBMPlexSansArabic-Regular.ttf) format("truetype")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:500;font-display:swap;src:url(get-to-know-oman/assets/fonts/IBMPlexSansArabic-Medium.ttf) format("truetype")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:600;font-display:swap;src:url(get-to-know-oman/assets/fonts/IBMPlexSansArabic-SemiBold.ttf) format("truetype")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:700;font-display:swap;src:url(get-to-know-oman/assets/fonts/IBMPlexSansArabic-Bold.ttf) format("truetype")}
/* Main menu: one kiosk for the whole pavilion. Three big touch cards open each screen full-screen inside this page
   (so full-screen mode is kept), and every screen has a "Main menu" button back here. */
:root{
  --ink:#ffffff; --cream:#ffe2b3; --gold:#fcaf17; --lilac:#e9cfe6; --soft:#c9a3c5;
  --night:#2a0829; --deep:#3a0d39; --plum:#591b58; --plum-2:#74306f; --glass:rgba(255,255,255,.08); --line:rgba(255,226,179,.22);
  --f:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --u:min(calc(100vw / 1920), calc(100vh / 1080));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--f);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:calc(4*var(--u)) solid var(--cream);outline-offset:calc(4*var(--u))}
img{-webkit-user-drag:none}
[hidden]{display:none!important}

.sky{position:fixed;inset:0;overflow:hidden;background:radial-gradient(70% 90% at 22% 30%,var(--plum-2) 0%,var(--plum) 38%,var(--deep) 70%,var(--night) 100%)}
.sky::before,.sky::after{content:"";position:absolute;border-radius:50%;filter:blur(calc(80*var(--u)));opacity:.55;animation:drift 26s ease-in-out infinite alternate}
.sky::before{width:calc(900*var(--u));height:calc(900*var(--u));left:calc(-200*var(--u));top:calc(-300*var(--u));background:radial-gradient(circle,#8b3a84,transparent 65%)}
.sky::after{width:calc(800*var(--u));height:calc(800*var(--u));right:calc(-250*var(--u));bottom:calc(-350*var(--u));background:radial-gradient(circle,#b8862a55,transparent 65%);animation-duration:32s}
@keyframes drift{to{transform:translate(calc(160*var(--u)),calc(90*var(--u))) scale(1.12)}}

main{position:fixed;inset:0;display:grid;place-items:center}
.stage{position:relative;width:calc(1920*var(--u));height:calc(1080*var(--u))}
.eyebrow{position:absolute;left:calc(120*var(--u));top:calc(92*var(--u));font-size:calc(20*var(--u));letter-spacing:.18em;text-transform:uppercase;color:var(--soft);font-weight:500}
.eyebrow b{color:var(--gold);font-weight:700}
.title{position:absolute;left:calc(120*var(--u));top:calc(140*var(--u))}
.title h1{font-weight:700;font-size:calc(100*var(--u));line-height:1.02;letter-spacing:-.015em}
.title h1 em{font-style:normal;color:var(--gold)}
.title p{font-weight:700;font-size:calc(50*var(--u));line-height:1.5;color:var(--cream);margin-top:calc(6*var(--u))}
.deco{position:absolute;pointer-events:none;filter:drop-shadow(0 calc(30*var(--u)) calc(30*var(--u)) rgba(10,0,10,.45))}
.deco img{width:100%;height:100%;object-fit:contain;animation:spin 70s linear infinite}
.d1{right:calc(-90*var(--u));top:calc(-110*var(--u));width:calc(360*var(--u));height:calc(360*var(--u))}
.d2{left:calc(1560*var(--u));top:calc(330*var(--u));width:calc(170*var(--u));height:calc(170*var(--u))}
.d2 img{animation-duration:50s;animation-direction:reverse}

.cards{position:absolute;left:calc(120*var(--u));right:calc(120*var(--u));top:calc(500*var(--u));height:calc(440*var(--u));display:grid;grid-template-columns:repeat(3,1fr);gap:calc(40*var(--u))}
.card{position:relative;border-radius:calc(40*var(--u));background:linear-gradient(170deg,rgba(255,255,255,.15),rgba(255,255,255,.04) 55%);border:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:flex-end;padding:calc(40*var(--u)) calc(40*var(--u)) calc(44*var(--u));text-align:start;
  box-shadow:0 calc(30*var(--u)) calc(60*var(--u)) rgba(10,0,10,.35);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),background .3s;
  animation:rise .9s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*110ms)}
@keyframes rise{from{opacity:0;transform:translateY(calc(80*var(--u)))}}
.card::after{content:"";position:absolute;left:calc(40*var(--u));right:calc(40*var(--u));bottom:0;height:calc(7*var(--u));border-radius:99px 99px 0 0;background:var(--c)}
.card:active{transform:scale(.97)}
.card .shape{position:absolute;right:calc(26*var(--u));top:calc(-96*var(--u));width:calc(270*var(--u));height:calc(270*var(--u));pointer-events:none}
.card .shape img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 calc(26*var(--u)) calc(28*var(--u)) rgba(10,0,10,.5));animation:spin var(--d) linear infinite, bob 6s ease-in-out infinite;animation-delay:0s,calc(var(--i)*-1.6s)}
@keyframes spin{to{rotate:360deg}}
@keyframes bob{50%{translate:0 calc(-16*var(--u))}}
.card .num{font-size:calc(20*var(--u));font-weight:700;letter-spacing:.16em;color:var(--soft);margin-bottom:calc(12*var(--u))}
.card h2{font-size:calc(56*var(--u));line-height:1.08;font-weight:700}
.card .ar{font-size:calc(30*var(--u));line-height:1.5;font-weight:600;color:var(--cream);margin-top:calc(4*var(--u));text-align:left}
.card .sub{font-size:calc(22*var(--u));line-height:1.4;color:var(--lilac);margin-top:calc(8*var(--u))}
.card .go{position:absolute;right:calc(36*var(--u));bottom:calc(44*var(--u));width:calc(72*var(--u));height:calc(72*var(--u));border-radius:50%;background:var(--cream);color:var(--plum);display:grid;place-items:center}
.card .go svg{width:calc(34*var(--u));height:calc(34*var(--u))}

.hint{position:absolute;left:50%;bottom:calc(30*var(--u));transform:translateX(-50%);display:flex;align-items:center;gap:calc(14*var(--u));font-size:calc(22*var(--u));color:var(--lilac);white-space:nowrap}
.hint .ring{width:calc(22*var(--u));height:calc(22*var(--u));border-radius:50%;border:2px solid var(--gold);position:relative}
.hint .ring::after{content:"";position:absolute;inset:calc(-6*var(--u));border-radius:50%;border:2px solid var(--gold);animation:ping 2s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.8)}}
.fs{position:absolute;right:calc(40*var(--u));bottom:calc(30*var(--u));width:calc(56*var(--u));height:calc(56*var(--u));border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;color:var(--soft)}
.fs svg{width:calc(24*var(--u));height:calc(24*var(--u))}
body.attract .card{animation:breathe 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*.5s)}
body.attract .hint{font-size:calc(28*var(--u));color:var(--cream)}
@keyframes breathe{50%{transform:translateY(calc(-18*var(--u)));background:linear-gradient(170deg,rgba(255,255,255,.21),rgba(255,255,255,.06) 55%)}}

/* the open screen sits on top, full screen */
#sec{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--night);opacity:0;transform:scale(1.04);transition:opacity .45s ease,transform .5s cubic-bezier(.2,.9,.3,1);pointer-events:none}
#sec.open{opacity:1;transform:none;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main>
  <div class="stage">
    <div class="deco d1" aria-hidden="true"><img src="get-to-know-oman/assets/sun.webp" alt=""></div>
    <p class="eyebrow"><b>COP31</b> · Oman Pavilion</p>
    <div class="title"><h1>Welcome to the <em>Oman Pavilion</em></h1></div>
    <div class="cards">
      <button class="card" type="button" data-go="registration/" style="--i:0;--c:#fcaf17;--d:60s">
        <span class="shape"><img src="registration/shapes/star.webp" alt=""></span>
        <span class="num">01</span><h2>Registration</h2><span class="sub">Register your visit</span>
        <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>
      <button class="card" type="button" data-go="get-to-know-oman/" style="--i:1;--c:#6fc7aa;--d:80s">
        <span class="shape"><img src="get-to-know-oman/assets/mangrove.webp" alt=""></span>
        <span class="num">02</span><h2>Get to Know Oman</h2><span class="sub">From Commitment to Implementation</span>
        <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>
      <button class="card" type="button" data-go="agenda/" style="--i:2;--c:#f49ab0;--d:70s">
        <span class="shape"><img src="get-to-know-oman/assets/rose.webp" alt=""></span>
        <span class="num">03</span><h2>Agenda</h2><span class="sub">Pavilion programme</span>
        <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>
    </div>
    <p class="hint"><span class="ring"></span><span>Touch to begin</span></p>
    <button class="fs" id="fsBtn" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</main>
<iframe id="sec" title="Pavilion screen" allow="fullscreen" hidden></iframe>
<script>
(() => {
  const sec = document.getElementById("sec");
  const IDLE_MS = 120000;        // no touch inside an open screen for 2 minutes -> back to this menu
  let idleT = null, attractT = null, closeT = null;

  // called by the "Main menu" button inside each screen (kiosk-menu.js)
  window.KIOSK_HUB = { close };

  function open(path) {
    clearTimeout(closeT); clearTimeout(attractT); document.body.classList.remove("attract");
    sec.hidden = false; sec.src = path + (path.includes("?") ? "&" : "?") + "kiosk=" + Date.now();
    sec.onload = () => {
      if (!sec.src || sec.src === "about:blank") return;
      requestAnimationFrame(() => sec.classList.add("open"));
      try { ["pointerdown", "keydown", "touchstart"].forEach(ev => sec.contentWindow.document.addEventListener(ev, armIdle, { passive: true })); } catch (e) {}
      armIdle();
    };
  }
  function close() {
    clearTimeout(idleT); sec.classList.remove("open");
    closeT = setTimeout(() => { sec.onload = null; sec.hidden = true; sec.src = "about:blank"; }, 500);
    armAttract();
  }
  function armIdle() { clearTimeout(idleT); idleT = setTimeout(close, IDLE_MS); }
  function armAttract() { clearTimeout(attractT); document.body.classList.remove("attract"); attractT = setTimeout(() => document.body.classList.add("attract"), 45000); }

  document.querySelectorAll(".card").forEach(b => b.addEventListener("click", () => open(b.dataset.go)));
  document.addEventListener("pointerdown", armAttract, { passive: true });
  armAttract();

  const fsBtn = document.getElementById("fsBtn");
  fsBtn.addEventListener("click", () => { const d = document; if (!d.fullscreenElement) (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen || (() => {})).call(d.documentElement); else d.exitFullscreen && d.exitFullscreen(); });
  document.addEventListener("fullscreenchange", () => { fsBtn.hidden = !!document.fullscreenElement; });
})();
</script>
</body>
</html>
