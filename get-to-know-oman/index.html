<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Get to Know Oman</title>
<style>
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:400;font-display:swap;src:url(assets/fonts/IBMPlexSansArabic-Regular.ttf) format("truetype")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:500;font-display:swap;src:url(assets/fonts/IBMPlexSansArabic-Medium.ttf) format("truetype")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:600;font-display:swap;src:url(assets/fonts/IBMPlexSansArabic-SemiBold.ttf) format("truetype")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:700;font-display:swap;src:url(assets/fonts/IBMPlexSansArabic-Bold.ttf) format("truetype")}
</style>
</head>
<body>
<style>
/* Layout: a 1920x1080 touch stage scaled to any screen. Home = title + five floating topic cards whose 3D COP shapes
   pop out of the card; a tap morphs the card into a full-screen topic (view transition). Topics swipe left/right,
   pinch or double-tap to zoom, a dock jumps between topics, Home is always one tap away. One committed look: night purple. */
:root{
  --ink:#ffffff; --cream:#ffe2b3; --gold:#fcaf17; --lilac:#e9cfe6; --soft:#c9a3c5;
  --night:#2a0829; --deep:#3a0d39; --plum:#591b58; --plum-2:#74306f; --glass:rgba(255,255,255,.08); --line:rgba(255,226,179,.22);
  --f:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --u:min(calc(100vw / 1920), calc(100vh / 1080));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--f);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px))}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:calc(4*var(--u)) solid var(--cream);outline-offset:calc(4*var(--u))}
img{max-width:none;-webkit-user-drag:none}
[hidden]{display:none!important}

/* ---------- living background ---------- */
.sky{position:fixed;inset:0;overflow:hidden;background:radial-gradient(70% 90% at 22% 30%,var(--plum-2) 0%,var(--plum) 38%,var(--deep) 70%,var(--night) 100%)}
.sky::before,.sky::after{content:"";position:absolute;border-radius:50%;filter:blur(calc(80*var(--u)));opacity:.55;animation:drift 26s ease-in-out infinite alternate}
.sky::before{width:calc(900*var(--u));height:calc(900*var(--u));left:calc(-200*var(--u));top:calc(-300*var(--u));background:radial-gradient(circle,#8b3a84,transparent 65%)}
.sky::after{width:calc(800*var(--u));height:calc(800*var(--u));right:calc(-250*var(--u));bottom:calc(-350*var(--u));background:radial-gradient(circle,#b8862a55,transparent 65%);animation-duration:32s}
@keyframes drift{to{transform:translate(calc(160*var(--u)),calc(90*var(--u))) scale(1.12)}}
.dust{position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(255,226,179,.5) 0 1px,transparent 2px),radial-gradient(circle at 70% 60%,rgba(255,226,179,.35) 0 1px,transparent 2px),radial-gradient(circle at 45% 80%,rgba(255,255,255,.3) 0 1px,transparent 2px);
  background-size:calc(240*var(--u)) calc(240*var(--u)),calc(330*var(--u)) calc(330*var(--u)),calc(410*var(--u)) calc(410*var(--u));animation:float 60s linear infinite;opacity:.6}
@keyframes float{to{background-position:calc(240*var(--u)) calc(-480*var(--u)),calc(-330*var(--u)) calc(-330*var(--u)),calc(410*var(--u)) calc(-820*var(--u))}}

/* ---------- home ---------- */
#home{position:fixed;inset:0;display:grid;place-items:center}
.stage{position:relative;width:calc(1920*var(--u));height:calc(1080*var(--u))}
.eyebrow{position:absolute;left:calc(120*var(--u));top:calc(92*var(--u));font-size:calc(20*var(--u));letter-spacing:.18em;text-transform:uppercase;color:var(--soft);font-weight:500}
.eyebrow b{color:var(--gold);font-weight:700}
.title{position:absolute;left:calc(120*var(--u));top:calc(142*var(--u));display:flex;flex-direction:column;gap:calc(4*var(--u))}
.title h1{font-weight:700;font-size:calc(132*var(--u));line-height:1;letter-spacing:-.015em;color:var(--ink)}
.title h1 em{font-style:normal;color:var(--gold)}
.title p{font-weight:700;font-size:calc(58*var(--u));line-height:1.35;color:var(--cream)}
.tag{position:absolute;left:calc(120*var(--u));top:calc(330*var(--u));font-size:calc(26*var(--u));color:var(--lilac);font-weight:500;display:flex;gap:calc(14*var(--u));align-items:center}
.tag i{width:calc(46*var(--u));height:calc(2*var(--u));background:var(--gold)}
.cards{position:absolute;left:calc(120*var(--u));right:calc(120*var(--u));top:calc(520*var(--u));height:calc(460*var(--u));display:grid;grid-template-columns:repeat(5,1fr);gap:calc(28*var(--u))}
.card{position:relative;border-radius:calc(36*var(--u));background:linear-gradient(170deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 55%);border:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:flex-end;padding:calc(30*var(--u)) calc(30*var(--u)) calc(32*var(--u));text-align:start;overflow:visible;
  box-shadow:0 calc(30*var(--u)) calc(60*var(--u)) rgba(10,0,10,.35);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),background .3s;animation:rise .9s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*90ms)}
@keyframes rise{from{opacity:0;transform:translateY(calc(80*var(--u)))}}
.card::after{content:"";position:absolute;left:calc(30*var(--u));right:calc(30*var(--u));bottom:0;height:calc(6*var(--u));border-radius:99px 99px 0 0;background:var(--c)}
.card.press{transform:scale(.95)}
.card .shape{position:absolute;left:50%;top:calc(-70*var(--u));width:calc(250*var(--u));height:calc(250*var(--u));margin-left:calc(-125*var(--u));pointer-events:none}
.card .shape img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 calc(26*var(--u)) calc(28*var(--u)) rgba(10,0,10,.5));animation:spin var(--d) linear infinite, bob 6s ease-in-out infinite;animation-delay:0s,calc(var(--i)*-1.2s)}
@keyframes spin{to{rotate:360deg}}
@keyframes bob{50%{translate:0 calc(-16*var(--u))}}
.card .meta{display:block;margin-bottom:calc(10*var(--u));height:calc(22*var(--u))}
.card .num{font-size:calc(18*var(--u));font-weight:700;letter-spacing:.14em;color:var(--soft)}
.card .live{display:inline-flex;align-items:center;gap:calc(8*var(--u));font-size:calc(16*var(--u));font-weight:700;letter-spacing:.14em;color:var(--gold)}
.card .live i{width:calc(10*var(--u));height:calc(10*var(--u));border-radius:50%;background:var(--gold);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.card h2{font-size:calc(38*var(--u));line-height:1.12;font-weight:700}
.card .sub{font-size:calc(19*var(--u));line-height:1.4;color:var(--lilac);margin-top:calc(10*var(--u));min-height:2.8em}
.card .go{position:absolute;right:calc(26*var(--u));bottom:calc(30*var(--u));width:calc(58*var(--u));height:calc(58*var(--u));border-radius:50%;background:var(--cream);color:var(--plum);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:.3s}
.card .go svg{width:50%;height:50%}
.hint{position:absolute;left:50%;bottom:calc(26*var(--u));transform:translateX(-50%);display:flex;align-items:center;gap:calc(14*var(--u));font-size:calc(22*var(--u));color:var(--lilac);white-space:nowrap}
.hint .ring{width:calc(22*var(--u));height:calc(22*var(--u));border-radius:50%;border:2px solid var(--gold);position:relative}
.hint .ring::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--gold);animation:ping 1.8s ease-out infinite}
@keyframes ping{to{transform:scale(2.6);opacity:0}}
.fs{position:absolute;right:calc(40*var(--u));bottom:calc(30*var(--u));width:calc(56*var(--u));height:calc(56*var(--u));border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;color:var(--soft)}
.fs svg{width:46%;height:46%}
/* attract mode: after a quiet minute the cards breathe and the hint grows */
body.attract .card{animation:breathe 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*.45s)}
body.attract .card .go{opacity:1;transform:none}
body.attract .hint{font-size:calc(28*var(--u));color:var(--cream)}
@keyframes breathe{50%{transform:translateY(calc(-18*var(--u)));background:linear-gradient(170deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 55%)}}

/* ---------- topic (full screen) ---------- */
#topic{position:fixed;inset:0;background:var(--night);overflow:hidden;touch-action:none}
.track{position:absolute;inset:0;display:flex;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.slide{flex:0 0 100%;height:100%;position:relative;overflow:hidden;display:grid;place-items:center}
.slide img.page{width:100%;height:100%;object-fit:contain;transform-origin:0 0;will-change:transform}
.ctl{position:absolute;z-index:3;display:flex;align-items:center;gap:calc(14*var(--u));height:calc(84*var(--u));padding:0 calc(34*var(--u)) 0 calc(26*var(--u));border-radius:99px;
  background:rgba(42,8,41,.78);border:1px solid var(--line);backdrop-filter:blur(12px);font-size:calc(28*var(--u));font-weight:700;color:var(--cream);box-shadow:0 calc(14*var(--u)) calc(34*var(--u)) rgba(0,0,0,.35);transition:opacity .35s,transform .35s}
.ctl svg{width:calc(34*var(--u));height:calc(34*var(--u))}
.ctl:active{transform:scale(.95)}
.homebtn{left:calc(24*var(--u) + env(safe-area-inset-left,0px));top:calc(24*var(--u) + env(safe-area-inset-top,0px));background:var(--cream);color:var(--plum)}
.arrow{top:50%;width:calc(84*var(--u));padding:0;justify-content:center;margin-top:calc(-42*var(--u))}
.arrow.prev{left:calc(20*var(--u))} .arrow.next{right:calc(20*var(--u))}
.dock{position:absolute;z-index:3;left:50%;bottom:calc(22*var(--u));transform:translateX(-50%);display:flex;gap:calc(10*var(--u));padding:calc(10*var(--u));border-radius:calc(40*var(--u));
  background:rgba(42,8,41,.8);border:1px solid var(--line);backdrop-filter:blur(12px);transition:opacity .35s,transform .35s}
.dock button{display:flex;align-items:center;gap:calc(10*var(--u));height:calc(70*var(--u));padding:0 calc(22*var(--u)) 0 calc(10*var(--u));border-radius:99px;font-size:calc(21*var(--u));font-weight:600;color:var(--lilac)}
.dock button img{width:calc(52*var(--u));height:calc(52*var(--u));object-fit:contain}
.dock button.on{background:var(--cream);color:var(--plum)}
#topic.calm .arrow,#topic.calm .dock{opacity:0;pointer-events:none}
#topic.calm .dock{transform:translateX(-50%) translateY(calc(30*var(--u)))}
.zoomtip{position:absolute;z-index:3;right:calc(24*var(--u));top:calc(24*var(--u));height:calc(64*var(--u));padding:0 calc(26*var(--u));border-radius:99px;background:rgba(42,8,41,.78);border:1px solid var(--line);
  display:flex;align-items:center;gap:calc(10*var(--u));font-size:calc(20*var(--u));color:var(--lilac);transition:opacity .4s}
.zoomtip svg{width:calc(28*var(--u));height:calc(28*var(--u))}
#topic.calm .zoomtip,#topic.onwx .zoomtip{opacity:0}

/* ---------- weather slide ---------- */
.wx{width:calc(1920*var(--u));height:calc(1080*var(--u));padding:calc(140*var(--u)) calc(110*var(--u)) calc(130*var(--u));display:grid;grid-template-columns:1.1fr 1fr;gap:calc(32*var(--u));
  background:radial-gradient(80% 90% at 20% 20%,var(--plum-2),var(--plum) 45%,var(--deep) 80%)}
.wx-main{position:relative;border-radius:calc(36*var(--u));background:var(--cream);color:var(--plum);padding:calc(44*var(--u)) calc(52*var(--u));display:flex;flex-direction:column;overflow:hidden}
.wx-main .big-sun{position:absolute;right:calc(-60*var(--u));top:calc(-60*var(--u));width:calc(330*var(--u));opacity:.95;animation:spin 50s linear infinite}
.wx-city b{display:block;font-size:calc(64*var(--u));line-height:1.05;font-weight:700}
.wx-city span{display:block;font-size:calc(46*var(--u));line-height:1.45;font-weight:700;opacity:.8}
.wx-now{display:flex;align-items:flex-end;gap:calc(26*var(--u));margin-top:calc(18*var(--u))}
.wx-temp{font-size:calc(210*var(--u));line-height:.82;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.wx-temp sup{font-size:.3em;vertical-align:1.9em;margin-left:.05em;letter-spacing:0}
.wx-cond{font-size:calc(36*var(--u));font-weight:700;padding-bottom:calc(14*var(--u))}
.wx-cond small{display:block;font-size:calc(24*var(--u));font-weight:500;opacity:.75;margin-top:calc(6*var(--u))}
.wx-days{margin-top:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:calc(12*var(--u))}
.wx-day{border-radius:calc(22*var(--u));background:rgba(89,27,88,.09);padding:calc(16*var(--u)) 0;display:flex;flex-direction:column;align-items:center;gap:calc(6*var(--u))}
.wx-day b{font-size:calc(22*var(--u))} .wx-day svg{width:calc(58*var(--u));height:calc(58*var(--u))}
.wx-day span{font-size:calc(22*var(--u));font-weight:700;font-variant-numeric:tabular-nums} .wx-day span i{font-style:normal;opacity:.55;font-weight:500}
.wx-side{display:flex;flex-direction:column;gap:calc(20*var(--u));min-height:0}
.wx-cities{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:calc(14*var(--u));min-height:0}
.wx-tile{border-radius:calc(26*var(--u));background:var(--glass);border:2px solid transparent;display:flex;align-items:center;gap:calc(16*var(--u));padding:0 calc(24*var(--u));text-align:start;transition:transform .2s,background .2s}
.wx-tile:active{transform:scale(.97)}
.wx-tile.sel{background:rgba(255,226,179,.16);border-color:var(--cream)}
.wx-tile svg{width:calc(56*var(--u));height:calc(56*var(--u));color:var(--cream);flex:none}
.wx-tile .n{flex:1;min-width:0} .wx-tile .n b{display:block;font-size:calc(28*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .wx-tile .n span{font-size:calc(22*var(--u));color:var(--lilac)}
.wx-tile .t{font-size:calc(44*var(--u));font-weight:700;font-variant-numeric:tabular-nums}
.wx-foot{display:flex;align-items:center;gap:calc(20*var(--u));border-radius:calc(26*var(--u));background:var(--glass);padding:calc(16*var(--u)) calc(22*var(--u))}
.wx-qr{width:calc(112*var(--u));height:calc(112*var(--u));background:#fff;border-radius:calc(12*var(--u));padding:calc(6*var(--u));flex:none}
.wx-qr svg{width:100%;height:100%;display:block}
.wx-foot p{font-size:calc(21*var(--u));line-height:1.4;color:var(--lilac)} .wx-foot p b{display:block;font-size:calc(25*var(--u));color:var(--cream)}
.wx-note{color:var(--gold);font-weight:600}

/* ---------- idle prompt ---------- */
#idle{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(20,2,20,.72);backdrop-filter:blur(6px)}
.idle-card{width:calc(720*var(--u));border-radius:calc(40*var(--u));background:var(--plum);border:1px solid var(--line);padding:calc(54*var(--u));text-align:center;display:flex;flex-direction:column;gap:calc(22*var(--u));align-items:center}
.idle-card h3{font-size:calc(48*var(--u))} .idle-card p{font-size:calc(26*var(--u));color:var(--lilac)}
.idle-card button{height:calc(96*var(--u));padding:0 calc(60*var(--u));border-radius:99px;background:var(--gold);color:var(--night);font-size:calc(32*var(--u));font-weight:700}
.count{font-size:calc(80*var(--u));font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}

/* view transition: the tapped card grows into the page */
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s}
::view-transition-group(hero){animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
[dir=rtl] .title,[dir=rtl] .eyebrow,[dir=rtl] .tag{left:auto;right:calc(120*var(--u));align-items:flex-end;text-align:right}
/* ================= native topic pages (shared) ================= */
.pg{position:relative;width:calc(1920*var(--u));height:calc(1080*var(--u));padding:calc(132*var(--u)) calc(110*var(--u)) calc(126*var(--u));overflow:hidden;
  background:radial-gradient(80% 90% at 15% 10%,var(--plum-2),var(--plum) 45%,var(--deep) 85%)}
.pg.green{background:radial-gradient(80% 90% at 15% 10%,#0f5a4c,#00352d 55%,#012620 100%)}
.pg h2.ttl{font-size:calc(66*var(--u));line-height:1.05;font-weight:700;color:var(--gold)}
.pg.green h2.ttl{color:#70c6aa}
.pg .lede{font-size:calc(25*var(--u));line-height:1.45;color:var(--lilac);margin-top:calc(10*var(--u));max-width:calc(1300*var(--u))}
.pg .deco{position:absolute;pointer-events:none;filter:drop-shadow(0 calc(20*var(--u)) calc(24*var(--u)) rgba(0,0,0,.35));animation:spin var(--d,60s) linear infinite}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* entrance: children with .in rise in, staggered by --k, every time the page becomes active */
.slide .in{opacity:0}
.slide.active .in{animation:inUp .7s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--k,0)*80ms + 120ms)}
@keyframes inUp{from{opacity:0;transform:translateY(calc(40*var(--u))) scale(.98)}to{opacity:1;transform:none}}
.tap{cursor:pointer}
.tap:active{transform:scale(.97)}
.tapnote{position:absolute;right:calc(110*var(--u));top:calc(60*var(--u));display:flex;align-items:center;gap:calc(12*var(--u));font-size:calc(21*var(--u));color:var(--lilac)}
.tapnote i{width:calc(16*var(--u));height:calc(16*var(--u));border-radius:50%;border:2px solid var(--gold);position:relative}
.tapnote i::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--gold);animation:ping 1.8s ease-out infinite}

/* ================= 1. General Facts ================= */
.gf{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:1fr 1.32fr;gap:calc(22*var(--u));height:calc(100% - 170*var(--u));margin-top:calc(26*var(--u))}
.gf .grp{border-radius:calc(30*var(--u));background:rgba(255,255,255,.07);border:1px solid var(--line);padding:calc(22*var(--u)) calc(24*var(--u));display:flex;flex-direction:column;gap:calc(16*var(--u));min-height:0}
.gf .grp h3{display:flex;align-items:center;gap:calc(14*var(--u));font-size:calc(30*var(--u));font-weight:600;color:var(--cream)}
.gf .grp h3 svg{width:calc(42*var(--u));height:calc(42*var(--u));color:var(--gold)}
.gf .tiles{flex:1;display:grid;gap:calc(16*var(--u));min-height:0}
.gf .t{position:relative;border-radius:calc(22*var(--u));background:rgba(42,8,41,.55);padding:calc(18*var(--u)) calc(22*var(--u));text-align:start;display:flex;flex-direction:column;justify-content:center;gap:calc(4*var(--u));overflow:hidden;
  transition:transform .25s,background .25s,box-shadow .25s;font-size:calc(20*var(--u));line-height:1.4;color:var(--ink)}
.gf .t > svg{width:calc(34*var(--u));height:calc(34*var(--u));color:var(--cream);margin-bottom:calc(2*var(--u))}
.gf .t .n{font-size:calc(50*var(--u));line-height:1.1;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.gf .t .n > span{white-space:nowrap}
.gf .t > *{position:relative;z-index:1}
.gf .t .n small{font-size:.45em;font-weight:600;color:var(--cream);margin-left:.2em}
.gf .t b{color:var(--cream);font-weight:600}
.gf .t .bg{position:absolute;z-index:0;right:calc(-34*var(--u));bottom:calc(-34*var(--u));width:calc(110*var(--u));opacity:.55;transition:transform .6s cubic-bezier(.2,.9,.3,1.3);pointer-events:none}
.gf .t.pop{background:rgba(255,226,179,.14);box-shadow:0 0 0 2px var(--cream) inset}
.gf .t.pop .bg{transform:rotate(120deg) scale(1.35)}
.gf .geo{grid-column:1/-1}.gf .geo .tiles{grid-template-columns:1.2fr 1.1fr 1fr 1.3fr}
.gf .her{grid-column:span 3}.gf .sus{grid-column:span 6}.gf .sus .tiles{grid-template-columns:1.25fr 1fr}.gf .soc{grid-column:span 3}

/* ================= 2. National Indicators ================= */
.ni{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:calc(24*var(--u));height:calc(100% - 100*var(--u));margin-top:calc(22*var(--u))}

  if (z.s === 1 && moved && Math.abs(dx) > innerWidth * .12) { go(cur + (dx < 0 ? 1 : -1)); }
  else if (z.s === 1) place();

let idleT = null, warnT = null, tick = null;
function closeIdle() { $("idle").hidden = true; clearTimeout(warnT); clearInterval(tick); }
function armIdle() {
  clearTimeout(idleT); closeIdle();
  if (!$("home").hidden) { idleT = setTimeout(() => document.body.classList.add("attract"), 45000); return; }
  idleT = setTimeout(() => {
    let n = 10; $("idleCount").textContent = n; $("idle").hidden = false;
    tick = setInterval(() => { n--; $("idleCount").textContent = Math.max(0, n); }, 1000);
    warnT = setTimeout(() => { closeIdle(); goHome(); }, 10000);
  }, 80000);
}
