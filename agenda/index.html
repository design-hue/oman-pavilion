<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda · Oman Pavilion · COP31</title>
<style>
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:400;font-display:swap;src:url(../get-to-know-oman/assets/fonts/IBMPlexSansArabic-Regular.ttf) format("truetype")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:500;font-display:swap;src:url(../get-to-know-oman/assets/fonts/IBMPlexSansArabic-Medium.ttf) format("truetype")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:600;font-display:swap;src:url(../get-to-know-oman/assets/fonts/IBMPlexSansArabic-SemiBold.ttf) format("truetype")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:700;font-display:swap;src:url(../get-to-know-oman/assets/fonts/IBMPlexSansArabic-Bold.ttf) format("truetype")}
/* Agenda: day buttons on the left (today is picked automatically), the chosen day's themes and sessions on the right.
   Sessions scroll by touch; during the event the session on now is highlighted. Same night-purple look as the other screens. */
:root{
  --ink:#ffffff; --cream:#ffe2b3; --gold:#fcaf17; --lilac:#e9cfe6; --soft:#c9a3c5;
  --night:#2a0829; --deep:#3a0d39; --plum:#591b58; --plum-2:#74306f; --glass:rgba(255,255,255,.08); --line:rgba(255,226,179,.2);
  --f:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --u:min(calc(100vw / 1920), calc(100vh / 1080));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--f);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
button:focus-visible{outline:calc(4*var(--u)) solid var(--cream);outline-offset:calc(4*var(--u))}
.sky{position:fixed;inset:0;overflow:hidden;background:radial-gradient(70% 90% at 18% 30%,var(--plum-2) 0%,var(--plum) 38%,var(--deep) 70%,var(--night) 100%)}
.sky::before{content:"";position:absolute;width:calc(900*var(--u));height:calc(900*var(--u));right:calc(-300*var(--u));bottom:calc(-400*var(--u));border-radius:50%;
  background:radial-gradient(circle,#b8862a44,transparent 65%);filter:blur(calc(80*var(--u)));animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(calc(-160*var(--u)),calc(-90*var(--u))) scale(1.1)}}
main{position:fixed;inset:0;display:grid;place-items:center}
.stage{position:relative;width:calc(1920*var(--u));height:calc(1080*var(--u))}

/* left rail */
.rail{position:absolute;left:calc(120*var(--u));top:calc(86*var(--u));width:calc(500*var(--u))}
.eyebrow{font-size:calc(20*var(--u));letter-spacing:.18em;text-transform:uppercase;color:var(--soft);font-weight:500}
.eyebrow b{color:var(--gold);font-weight:700}
.rail h1{font-size:calc(74*var(--u));line-height:1.05;font-weight:700;margin-top:calc(18*var(--u))}
.rail h1 em{font-style:normal;color:var(--gold)}
.rail .place{font-size:calc(22*var(--u));color:var(--lilac);margin-top:calc(10*var(--u))}
.days{display:grid;grid-template-columns:1fr 1fr;gap:calc(16*var(--u));margin-top:calc(40*var(--u))}
.dbtn{position:relative;height:calc(112*var(--u));border-radius:calc(24*var(--u));padding:calc(16*var(--u)) calc(22*var(--u));background:var(--glass);border:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:center;transition:transform .25s cubic-bezier(.2,.9,.3,1.2),background .25s,border-color .25s}
.dbtn:active{transform:scale(.96)}
.dbtn .n{font-size:calc(16*var(--u));letter-spacing:.16em;font-weight:700;color:var(--soft);text-transform:uppercase}
.dbtn .d{font-size:calc(30*var(--u));font-weight:700;line-height:1.2;margin-top:calc(2*var(--u))}
.dbtn .today{position:absolute;right:calc(14*var(--u));top:calc(14*var(--u));font-size:calc(14*var(--u));font-weight:700;letter-spacing:.12em;color:var(--plum);background:var(--gold);border-radius:99px;padding:calc(3*var(--u)) calc(10*var(--u))}
.dbtn.on{background:var(--cream);border-color:var(--cream);color:var(--plum)}
.dbtn.on .n{color:#8a5a84}
.dbtn.on .today{background:var(--plum);color:var(--cream)}

/* right: day header + sessions */
.main{position:absolute;left:calc(700*var(--u));right:calc(100*var(--u));top:calc(70*var(--u));bottom:calc(36*var(--u));display:flex;flex-direction:column}
.dhead{display:flex;gap:calc(34*var(--u));align-items:flex-start;padding-bottom:calc(26*var(--u));border-bottom:1px solid var(--line)}
.dnum{flex:none;width:calc(150*var(--u));height:calc(150*var(--u));border-radius:calc(32*var(--u));background:linear-gradient(160deg,#fcaf17,#e08a00);color:var(--plum);display:flex;flex-direction:column;align-items:center;justify-content:center}
.dnum small{font-size:calc(18*var(--u));font-weight:700;letter-spacing:.2em}
.dnum b{font-size:calc(76*var(--u));line-height:1;font-weight:700}
.dinfo{flex:1;min-width:0}
.dinfo .date{font-size:calc(42*var(--u));font-weight:700;line-height:1.15}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:calc(26*var(--u));margin-top:calc(16*var(--u))}
.themes h3{font-size:calc(15*var(--u));letter-spacing:.16em;text-transform:uppercase;color:#7fd3b5;font-weight:700}
.themes p{font-size:calc(21*var(--u));line-height:1.35;color:var(--lilac);margin-top:calc(4*var(--u))}
.count{flex:none;text-align:center;padding-top:calc(6*var(--u))}
.count b{display:block;font-size:calc(54*var(--u));line-height:1;font-weight:700;color:var(--gold)}
.count span{font-size:calc(15*var(--u));letter-spacing:.16em;text-transform:uppercase;color:var(--soft);font-weight:700}

.listwrap{position:relative;flex:1;min-height:0;margin-top:calc(22*var(--u))}
.list{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:0 calc(10*var(--u)) calc(60*var(--u)) 0;scrollbar-width:none;touch-action:pan-y;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 90*var(--u)),transparent);mask-image:linear-gradient(#000 calc(100% - 90*var(--u)),transparent)}
.list::-webkit-scrollbar{display:none}
.s{position:relative;display:flex;gap:calc(28*var(--u));padding:calc(24*var(--u)) calc(30*var(--u)) calc(26*var(--u)) calc(28*var(--u));margin-bottom:calc(16*var(--u));border-radius:calc(26*var(--u));
  background:linear-gradient(170deg,rgba(255,255,255,.11),rgba(255,255,255,.035));border:1px solid var(--line);overflow:hidden;animation:in .6s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*55ms)}
@keyframes in{from{opacity:0;transform:translateY(calc(40*var(--u)))}}
.s::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(8*var(--u));background:var(--c)}
.s .tm{flex:none;width:calc(150*var(--u))}
.s .tm b{display:block;font-size:calc(40*var(--u));line-height:1.05;font-weight:700}
.s .tm span{font-size:calc(20*var(--u));color:var(--soft)}
.s .tm.tbc b{font-size:calc(34*var(--u));color:var(--cream)}
.s .bd{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:calc(8*var(--u));font-size:calc(15*var(--u));font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c);
  background:color-mix(in srgb,var(--c) 16%,transparent);border-radius:99px;padding:calc(5*var(--u)) calc(14*var(--u)) calc(5*var(--u)) calc(10*var(--u))}
.pill svg{width:calc(18*var(--u));height:calc(18*var(--u))}
.s h2{font-size:calc(28*var(--u));line-height:1.28;font-weight:700;margin-top:calc(10*var(--u))}
.meta{margin-top:calc(10*var(--u));display:grid;gap:calc(5*var(--u))}
.meta p{display:flex;gap:calc(10*var(--u));font-size:calc(19*var(--u));line-height:1.4;color:var(--lilac)}
.meta p svg{flex:none;width:calc(22*var(--u));height:calc(22*var(--u));margin-top:calc(2*var(--u));color:var(--c)}
.meta p b{color:var(--ink);font-weight:600}
.s.now{border-color:var(--gold);background:linear-gradient(170deg,rgba(252,175,23,.2),rgba(255,255,255,.04));box-shadow:0 0 0 calc(2*var(--u)) rgba(252,175,23,.35)}
.flag{position:absolute;right:calc(24*var(--u));top:calc(22*var(--u));font-size:calc(15*var(--u));font-weight:700;letter-spacing:.14em;border-radius:99px;padding:calc(4*var(--u)) calc(12*var(--u))}
.flag.live{background:var(--gold);color:var(--plum)}
.flag.live i{display:inline-block;width:calc(9*var(--u));height:calc(9*var(--u));border-radius:50%;background:var(--plum);margin-right:calc(8*var(--u));animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.flag.next{border:1px solid var(--gold);color:var(--gold)}
.s.past{opacity:.55}
.more{position:absolute;left:50%;bottom:calc(4*var(--u));transform:translateX(-50%);display:flex;align-items:center;gap:calc(10*var(--u));font-size:calc(18*var(--u));color:var(--cream);
  background:rgba(42,8,41,.8);border:1px solid var(--line);border-radius:99px;padding:calc(8*var(--u)) calc(20*var(--u));pointer-events:none;transition:opacity .3s}
.more svg{width:calc(20*var(--u));height:calc(20*var(--u));animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(calc(5*var(--u)))}}
.deco{position:absolute;pointer-events:none;width:calc(300*var(--u));height:calc(300*var(--u));left:calc(-150*var(--u));bottom:calc(-175*var(--u));filter:drop-shadow(0 calc(26*var(--u)) calc(28*var(--u)) rgba(10,0,10,.45))}
.deco img{width:100%;height:100%;object-fit:contain;animation:spin 80s linear infinite}
@keyframes spin{to{rotate:360deg}}
.swap{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateX(calc(30*var(--u)))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main>
  <div class="stage">
    <div class="deco" aria-hidden="true"><img src="../get-to-know-oman/assets/rose.webp" alt=""></div>
    <aside class="rail">
      <p class="eyebrow"><b>COP31</b> · Oman Pavilion</p>
      <h1>Daily <em>Programme</em></h1>
      <p class="place">Sultanate of Oman Pavilion · COP31 Antalya, Türkiye</p>
      <div class="days" id="days" role="tablist" aria-label="Programme days"></div>
    </aside>
    <section class="main" aria-live="polite">
      <header class="dhead" id="dhead"></header>
      <div class="listwrap"><div class="list" id="list"></div><p class="more" id="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>Scroll for more</p></div>
    </section>
  </div>
</main>
<script src="data.js"></script>
<script>
(() => {
  const P = window.PROGRAMME;
  const $ = id => document.getElementById(id);
  const TYPES = {
    event:        { label: "Event",                    c: "#eaa63a", i: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>' },
    high:         { label: "High-level session",       c: "#cf86ee", i: '<path d="M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-6 10 6"/>' },
    presentation: { label: "Presentation",             c: "#46d0a5", i: '<path d="M3 4h18v12H3zM12 16v4M8 20h8"/>' },
    visual:       { label: "Visual presentation",      c: "#f4728f", i: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>' },
    signing:      { label: "Agreement signing",        c: "#6fa8f5", i: '<path d="M4 15l4 4 3-3M2 12l5-5 4 2 3-3 6 6-6 6M14 7l4-1 4 4"/>' },
    panel:        { label: "Session / panel discussion", c: "#e2b6f2", i: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.4c3 .3 5.5 2.6 5.5 5.6"/>' },
    display:      { label: "Pavilion display",         c: "#ffe2b3", i: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>' }
  };
  const ICON = {
    org: '<path d="M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-6 10 6"/>',
    mod: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',
    spk: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.4c3 .3 5.5 2.6 5.5 5.6"/>'
  };
  const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dt = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const WD = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MO = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };

  // which day to open: today if it is a programme day, else the next one (or the last one after the event)
  function pickDay() {
    const t = ymd(new Date());
    let i = P.findIndex(d => d.date === t); if (i >= 0) return i;
    i = P.findIndex(d => d.date > t); return i >= 0 ? i : P.length - 1;
  }
  let cur = pickDay();

  function renderDays() {
    const today = ymd(new Date());
    $("days").innerHTML = P.map((d, i) => {
      const D = dt(d.date);
      return `<button class="dbtn${i === cur ? " on" : ""}" role="tab" aria-selected="${i === cur}" data-i="${i}">
        <span class="n">Day ${d.day}</span><span class="d">${WD[D.getDay()].slice(0, 3)} ${D.getDate()} ${MO[D.getMonth()].slice(0, 3)}</span>
        ${d.date === today ? '<span class="today">TODAY</span>' : ""}</button>`;
    }).join("");
    $("days").querySelectorAll(".dbtn").forEach(b => b.addEventListener("click", () => { if (+b.dataset.i !== cur) { cur = +b.dataset.i; render(true); } }));
  }

  function render(anim) {
    renderDays();
    const d = P[cur], D = dt(d.date);
    $("dhead").innerHTML = `<div class="dnum"><small>DAY</small><b>${d.day}</b></div>
      <div class="dinfo"><p class="date">${WD[D.getDay()]}, ${D.getDate()} ${MO[D.getMonth()]} ${D.getFullYear()}</p>
        <div class="themes"><div><h3>Theme of the day</h3>${d.theme.map(t => `<p>${esc(t)}</p>`).join("")}</div>
        <div><h3>Türkiye theme</h3>${d.tr.map(t => `<p>${esc(t)}</p>`).join("")}</div></div></div>
      <div class="count"><b>${d.sessions.length}</b><span>${d.sessions.length === 1 ? "Activity" : "Activities"}</span></div>`;
    const isToday = d.date === ymd(new Date()), now = new Date(), nm = now.getHours() * 60 + now.getMinutes();
    let nextFlagged = false;
    $("list").innerHTML = d.sessions.map((s, i) => {
      const T = TYPES[s.type] || TYPES.event, tbc = s.time === "TBC";
      let cls = "", flag = "";
      if (isToday && !tbc) {
        const a = mins(s.time), b = s.end ? mins(s.end) : a + 30;
        if (nm >= a && nm < b) { cls = " now"; flag = '<span class="flag live"><i></i>ON NOW</span>'; }
        else if (nm >= b) cls = " past";
        else if (!nextFlagged) { nextFlagged = true; flag = '<span class="flag next">UP NEXT</span>'; }
      }
      const rows = [];
      if (s.org) rows.push(`<p>${svg(ICON.org)}<span><b>Organising entity:</b> ${esc(s.org)}</span></p>`);
      if (s.mod) rows.push(`<p>${svg(ICON.mod)}<span><b>Moderator:</b> ${esc(s.mod)}</span></p>`);
      if (s.spk) rows.push(`<p>${svg(ICON.spk)}<span><b>Speakers:</b> ${esc(s.spk)}</span></p>`);
      if (s.pres) rows.push(`<p>${svg(ICON.spk)}<span><b>Presenter:</b> ${esc(s.pres)}</span></p>`);
      if (s.sp2) rows.push(`<p>${svg(ICON.spk)}<span><b>Speakers / Presenters:</b> ${esc(s.sp2)}</span></p>`);
      return `<article class="s${cls}" style="--c:${T.c};--i:${i}">
        <div class="tm${tbc ? " tbc" : ""}">${tbc ? "<b>TBC</b><span>Time to be confirmed</span>" : `<b>${s.time}</b><span>to ${s.end}</span>`}</div>
        <div class="bd"><span class="pill">${svg(T.i)}${T.label}</span><h2>${esc(s.title)}</h2><div class="meta">${rows.join("")}</div></div>${flag}</article>`;
    }).join("");
    const list = $("list"); list.scrollTop = 0;
    if (anim) { const m = document.querySelector(".main"); m.classList.remove("swap"); void m.offsetWidth; m.classList.add("swap"); }
    const live = list.querySelector(".now") || list.querySelector(".flag.next")?.closest(".s");
    if (live) setTimeout(() => list.scrollTo({ top: live.offsetTop - 10, behavior: "smooth" }), 500);
    moreHint();
  }
  function moreHint() { const l = $("list"); $("more").style.opacity = l.scrollHeight - l.clientHeight - l.scrollTop > 40 ? 1 : 0; }
  $("list").addEventListener("scroll", moreHint, { passive: true });

  // swipe left / right on the session list to change day
  let sx = null, sy = null;
  $("list").addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
  $("list").addEventListener("pointerup", e => {
    if (sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 120 && Math.abs(dx) > Math.abs(dy) * 1.6) { const n = cur + (dx < 0 ? 1 : -1); if (n >= 0 && n < P.length) { cur = n; render(true); } }
  });
  // keep "on now" fresh and return to today after a quiet while
  let quiet = null, last = 0;
  document.addEventListener("pointerdown", () => { last = Date.now(); clearTimeout(quiet); quiet = setTimeout(() => { cur = pickDay(); render(false); }, 90000); }, { passive: true });
  setInterval(() => { if (P[cur].date === ymd(new Date()) && Date.now() - last > 60000) render(false); }, 60000);
  render(false);
})();
</script>
<script>window.KIOSK_MENU = { pos: { left: 120, bottom: 28 } };</script>
<script src="../kiosk-menu.js"></script>
</body>
</html>
